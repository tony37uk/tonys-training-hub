<style>

  }

  .top-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 12px 28px; }

  .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: .02em; }
  .search { flex: 1 1 320px; max-width: 560px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 12px; background: #f9fafc; }
  .search:focus-within { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: var(--ink); }
  .search kbd { font-family: inherit; font-size: 12px; font-weight: 700; color: var(--muted-2); border: 1px solid #d5d9e4; border-radius: 6px; padding: 1px 7px; }
  .top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-left: auto; }
  .progress { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #3d4560; }
  .bar { width: 120px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .btn { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 800; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: #5b21b6; color: #fff; }

  /* Layout */
  .layout { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; }
  .side { flex: 1 1 240px; padding: 24px 16px 24px 24px; display: flex; flex-direction: column; gap: 22px; align-self: flex-start; position: sticky; top: 69px; }
  .side h2 { margin: 0 0 6px 12px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); }
  .side-list { display: flex; flex-direction: column; gap: 2px; }
  .nav-btn { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 700; text-align: left; cursor: pointer; }
  .nav-btn:hover { background: #eceef6; }
  .nav-btn[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
  .nav-btn .n { font-size: 12px; font-weight: 700; color: var(--muted-2); }
  .main { flex: 999 1 560px; min-width: 0; padding: 28px 28px 56px; }

  .crumb { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--muted-2); }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
  .head h1 { margin: 0 0 6px; font-family: 'Poppins', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.2; }
  .head p { margin: 0; font-size: 15px; color: #3d4560; }
  .count { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted-2); white-space: nowrap; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill { height: 36px; padding: 0 14px; border: 1px solid #d5d9e4; border-radius: 999px; background: #fff; color: var(--ink-2); font-size: 13px; font-weight: 700; cursor: pointer; }
  .pill:hover { border-color: #a5adc2; }
  .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; transition: border-color .15s, box-shadow .15s; }
  .row:hover { border-color: #c4b5fd; box-shadow: 0 4px 14px rgba(20,26,46,.06); }
  .row.done { background: #f7fdf9; border-color: #bfe8cf; }
  .row.done .title a { color: #5b6378; text-decoration: line-through; text-decoration-color: #9aa3b8; }
  .check { width: 28px; height: 28px; flex: 0 0 28px; padding: 0; border-radius: 50%; border: 2px solid #c5cbda; background: #fff; color: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .check::before { content: ''; position: absolute; inset: -8px; }
  .check:hover { border-color: var(--ok); }
  .check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .body { flex: 1 1 auto; min-width: 0; }
  .title { margin: 0 0 3px; font-size: 16px; font-weight: 800; }
  .title a { color: var(--ink); text-decoration: none; }
  .title a:hover { color: #5b21b6; text-decoration: underline; }
  .desc { margin: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
  .src { font-size: 13px; font-weight: 700; color: var(--muted-2); }
  .site { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .go { flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5b21b6; border-radius: 10px; }
  .go:hover { background: var(--accent-soft); }
  .topic-tag { font-size: 12px; font-weight: 700; color: var(--muted-2); }

  .chip { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .chip-Tool { background: #ede9fe; color: #5b21b6; }
  .chip-Course { background: #dbeafe; color: #1e40af; }
  .chip-Guide { background: #fef0d4; color: #8a4b00; }
  .chip-Video { background: #ffe4ee; color: #9d1747; }
  .chip-Article { background: #e6edf5; color: #334155; }


  /* Topic colours */
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
  .nav-label { display: flex; align-items: center; gap: 10px; }
  .t-basics { background: #eff5ff; border-color: #2563eb33; } .t-basics .tile-bar { background: #2563eb; } .t-basics .tile-n { background: #1e40af; } .t-basics .tile-mix { color: #1e40af; } .d-basics { background: #2563eb; }
  .t-tools { background: #f4efff; border-color: #7c3aed33; } .t-tools .tile-bar { background: #7c3aed; } .t-tools .tile-n { background: #5b21b6; } .t-tools .tile-mix { color: #5b21b6; } .d-tools { background: #7c3aed; }
  .t-prompting { background: #fff6e5; border-color: #d9770633; } .t-prompting .tile-bar { background: #d97706; } .t-prompting .tile-n { background: #92400e; } .t-prompting .tile-mix { color: #92400e; } .d-prompting { background: #d97706; }
  .t-claude { background: #fff1e8; border-color: #ea580c33; } .t-claude .tile-bar { background: #ea580c; } .t-claude .tile-n { background: #9a3412; } .t-claude .tile-mix { color: #9a3412; } .d-claude { background: #ea580c; }
  .t-coding { background: #ecfbf1; border-color: #16a34a33; } .t-coding .tile-bar { background: #16a34a; } .t-coding .tile-n { background: #166534; } .t-coding .tile-mix { color: #166534; } .d-coding { background: #16a34a; }
  .t-agents { background: #e8faf7; border-color: #0d948833; } .t-agents .tile-bar { background: #0d9488; } .t-agents .tile-n { background: #115e59; } .t-agents .tile-mix { color: #115e59; } .d-agents { background: #0d9488; }
  .t-security { background: #fef2f2; border-color: #dc262633; } .t-security .tile-bar { background: #dc2626; } .t-security .tile-n { background: #991b1b; } .t-security .tile-mix { color: #991b1b; } .d-security { background: #dc2626; }
  .t-courses { background: #fff0f6; border-color: #db277733; } .t-courses .tile-bar { background: #db2777; } .t-courses .tile-n { background: #9d174d; } .t-courses .tile-mix { color: #9d174d; } .d-courses { background: #db2777; }
  .new-tag { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #166534; background: #d9f5e5; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .title .new-tag { margin-left: 8px; vertical-align: 2px; }

  /* Home */
  .home { display: flex; flex-direction: column; gap: 36px; }
  .home h2.sec { margin: 0; font-family: 'Poppins', sans-serif; font-size: 21px; font-weight: 700; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .sec-head p { margin: 0; font-size: 14px; color: var(--muted-2); }
  .hero-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; }
  .welcome { flex: 999 1 420px; background: #5b21b6; color: #fff; border-radius: 18px; padding: 30px 32px; display: flex; flex-direction: column; gap: 14px; }
  .welcome h1 { margin: 0; font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.2; }
  .welcome p.lead { margin: 0; font-size: 16px; line-height: 1.55; color: #ede9fe; max-width: 560px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 6px; }
  .stats b { display: block; font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 700; }
  .stats span { font-size: 13px; font-weight: 700; color: #ddd6fe; }
  .continue { flex: 1 1 260px; background: #115e59; color: #fff; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .continue h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #99f6e4; }
  .continue p { margin: 0; font-size: 14px; color: #ccfbf1; }
  .continue .next { font-family: 'Poppins', sans-serif; font-size: 19px; font-weight: 600; line-height: 1.3; color: #fff; }
  .continue .cta { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 10px; background: #fbbf24; color: #141a2e; font-weight: 800; font-size: 14px; text-decoration: none; }
  .continue .cta:hover { background: #f59e0b; color: #141a2e; }
  .steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }

  .step:hover, .tile:hover { border-color: #a78bfa; box-shadow: 0 6px 18px rgba(20,26,46,.08); color: var(--ink); }
  .step .num { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .step .st { font-size: 16px; font-weight: 800; line-height: 1.3; }
  .step .sf { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted-2); }

  .tile-n { font-size: 12px; font-weight: 800; color: #fff; border-radius: 99px; padding: 3px 9px; }
  .tile-b { font-size: 14px; line-height: 1.5; color: var(--muted); }

  .panel.gd { background: #fffbeb; border: 1px solid #fde68a; }
  .panel .sec-head { margin-bottom: 8px; }
  .panel h2 { font-size: 19px !important; }
  .plist { margin: 0; padding: 0; list-style: none; }

  .plist .pt a:hover { color: #5b21b6; text-decoration: underline; }
  .plist .ps { font-size: 13px; color: var(--muted-2); }
  .plist .pr { font-size: 13px; color: var(--muted-2); white-space: nowrap; }
  .home-ico { display: inline-flex; }
  @media (max-width: 820px) {
    .welcome { padding: 24px; }

  }

  .empty button { margin-top: 10px; }
  .foot { max-width: 1280px; margin: 0 auto; padding: 24px 28px 40px; font-size: 13px; color: var(--muted-2); border-top: 1px solid var(--line); }

  @media (max-width: 820px) {
    .top { position: static; }
    .top-inner { padding: 12px 16px; }
    .go { display: none; }

    .side-list { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .side h2 { margin-left: 0; }
    .nav-btn { width: auto; white-space: nowrap; border: 1px solid #d5d9e4; background: #fff; }
    .main { padding: 18px 16px 40px; }
    .head h1 { font-size: 24px; }
    .row { flex-wrap: wrap; gap: 10px 14px; padding: 14px; }
    .body { flex-basis: calc(100% - 90px); }
    .desc { white-space: normal; }
    .meta { order: 3; flex-basis: 100%; padding-left: 42px; justify-content: flex-start; flex-wrap: wrap; gap: 8px 12px; }
    .bar { width: 80px; }
  }
</style>

  $("pills").innerHTML = ["All", ...present].map(t => {
    const n = t === "All" ? base.length : base.filter(i => i.type === t).length;
    return `<button class="pill" data-type="${t}" aria-pressed="${state.type === t}">${t === "All" ? "All" : t + "s"} (${n})</button>`;
  }).join("");
  $("pills").style.display = base.length ? "" : "none";

  const list = base.filter(i => state.type === "All" || i.type === state.type);
  $("count").textContent = list.length === 1 ? "1 item" : `${list.length} items`;
  const showTopic = !isTopic;

  if (!list.length) {
    const msg = state.q ? "Nothing matches that search yet."
      : state.view === "done" ? "You haven't ticked anything off yet. Tick the circle next to any resource once you've finished it."
      : state.view === "todo" ? "You've completed everything on the hub. Nice work."
      : "Nothing here yet.";
    $("rows").innerHTML = `<div class="empty"><p style="margin:0">${msg}</p>${state.q ? '<button class="pill" data-clear="1">Clear search</button>' : ""}</div>`;
    return;
  }
  $("rows").innerHTML = list.map(i => {
    const d = !!done[i.title];
    const site = i.site ? `<a class="site" href="${esc(i.site)}" target="_blank" rel="noopener">Visit site</a>` : "";
    return `<article class="row${d ? " done" : ""}">
      <button class="check" data-done="${esc(i.title)}" aria-pressed="${d}" aria-label="${d ? "Completed: " : "Mark complete: "}${esc(i.title)}">${TICK}</button>
      <div class="body">
        <h2 class="title"><a href="${esc(i.url)}"${ext(i.url)}>${esc(i.title)}</a>${isNew(i) ? '<span class="new-tag">New</span>' : ""}</h2>
        <p class="desc" title="${esc(i.desc)}">${esc(i.desc)}</p>
      </div>
      <div class="meta">
        ${showTopic ? `<span class="topic-tag">${esc(topicName(i.topic))}</span>` : ""}
        ${site}
        <span class="src">${esc(i.src)}</span>
        <span class="chip chip-${i.type}">${i.type}</span>
      </div>
      <a class="go" href="${esc(i.url)}"${ext(i.url)} aria-label="Open ${esc(i.title)}">${ARROW}</a>
    </article>`;
  }).join("");
}

function renderHome() {
  const doneN = ITEMS.filter(i => done[i.title]).length;
  const guides = ITEMS.filter(i => /^guide-/.test(i.url));
  const courses = ITEMS.filter(i => i.type === "Course").length;
  const link = i => `href="${esc(i.url)}"${ext(i.url)}`;

  let next = null, intro;
  if (!doneN) { next = byTitle[STARTER[0][0]]; intro = "New here? Start with step 1:"; }
  else {
    next = STARTER.map(s => byTitle[s[0]]).find(i => i && !done[i.title])
      || TOPICS.flatMap(t => ITEMS.filter(i => i.topic === t[0])).find(i => !done[i.title]);
    intro = `${doneN} of ${ITEMS.length} done. Next on your list:`;
  }
  const cont = next
    ? `<p>${intro}</p><p class="next">${esc(next.title)}</p><p>${[next.type, next.src, topicName(next.topic)].filter((x, ix, arr) => x && arr.indexOf(x) === ix).map(esc).join(" · ")}</p>
       <a class="cta" ${link(next)}>${doneN ? "Continue" : "Start"} ${ARROW}</a>`
    : `<p class="next">You've completed everything on the hub.</p><p>Nice work. Check back for new resources.</p>`;

  const steps = STARTER.map(([title, len], ix) => {
    const i = byTitle[title]; if (!i) return "";
    const d = !!done[title];
    return `<li><a class="step s-${ix + 1}${d ? " is-done" : ""}" ${link(i)}>
      <span class="num" aria-hidden="true">${d ? "✓" : ix + 1}</span>
      <span class="st">${esc(title)}${d ? '<span class="sr"> (completed)</span>' : ""}</span>
      <span class="sf"><span class="chip chip-${i.type}">${i.type}</span><span>${len}</span></span></a></li>`;
  }).join("");

  const tiles = TOPICS.map(([id, name, blurb]) => {
    const its = ITEMS.filter(i => i.topic === id);
    const mix = TYPES.map(ty => [ty, its.filter(i => i.type === ty).length]).filter(x => x[1])
      .sort((a, b) => b[1] - a[1]).map(([ty, n]) => `${n} ${n === 1 ? ty.toLowerCase() : PLURAL[ty]}`).join(" · ");
    return `<a class="tile t-${id}" href="#${id}" data-view="${id}"><span class="tile-bar"></span>
      <span class="tile-top"><span>${esc(name)}</span><span class="tile-n">${its.length}</span></span>
      <span class="tile-b">${esc(blurb)}</span><span class="tile-mix">${mix}</span></a>`;
  }).join("");

  const recent = newest().slice(0, 6).map(i => `<li>${isNew(i) ? '<span class="new-tag">New</span>' : ""}
    <span class="pt"><a ${link(i)}>${esc(i.title)}</a><span class="ps">${esc(topicName(i.topic))}</span></span>
    <span class="chip chip-${i.type}">${i.type}</span></li>`).join("");
  const glist = guides.map(i => `<li><span class="pt"><a ${link(i)}>${esc(i.title)}</a></span><span class="pr">${esc(topicName(i.topic))}</span></li>`).join("");

  $("homeView").innerHTML = `
    <section class="hero-row" aria-labelledby="welcome-h">
      <div class="welcome">
        <h1 id="welcome-h">Learn AI, one step at a time</h1>
        <p class="lead">Free, hand-picked tools, courses, guides and videos, from your first prompt to building your own agents.</p>
        <div class="stats">
          <div><b>${ITEMS.length}</b><span>resources</span></div>
          <div><b>${TOPICS.length}</b><span>topics</span></div>
          <div><b>${courses}</b><span>courses</span></div>
          <div><b>${guides.length}</b><span>step-by-step guides</span></div>
        </div>
      </div>
      <aside class="continue" aria-labelledby="cont-h"><h2 id="cont-h">${doneN ? "Pick up where you left off" : "Your first step"}</h2>${cont}</aside>
    </section>
    <section aria-labelledby="start-h">
      <div class="sec-head"><h2 class="sec" id="start-h">New here? Start with these four</h2><p>About 4 hours in total, all free</p></div>
      <ol class="steps">${steps}</ol>
    </section>
    <section aria-labelledby="topics-h">
      <div class="sec-head"><h2 class="sec" id="topics-h">Browse by topic</h2></div>
      <div class="tiles">${tiles}</div>
    </section>
    <div class="duo">
      <section class="panel new" aria-labelledby="new-h">
        <div class="sec-head"><h2 class="sec" id="new-h">Recently added</h2><a href="#new" data-view="new" style="font-size:14px;font-weight:800">See all new</a></div>
        <ul class="plist">${recent}</ul>
      </section>
      <section class="panel gd" aria-labelledby="guides-h">
        <div class="sec-head"><h2 class="sec" id="guides-h">Tony's step-by-step guides</h2><span class="ps" style="font-size:14px;font-weight:700;color:var(--muted-2)">${guides.length} guides</span></div>
        <ul class="plist">${glist}</ul>
      </section>
    </div>`;
}

function render() {
  renderNav();
  const home = !state.q && state.view === "home";
  $("homeView").hidden = !home; $("listView").hidden = home;
  if (home) renderHome(); else renderMain();
  const cur = document.querySelector('.nav-btn[aria-current="true"]');
  if (cur && window.innerWidth <= 820) { const l = cur.parentElement; l.scrollLeft = cur.offsetLeft - l.offsetLeft - (l.clientWidth - cur.offsetWidth) / 2; }
}

function go(view, push) {
  state.view = view; state.type = "All"; state.q = ""; $("q").value = "";
  if (push) { try { history.replaceState(null, "", "#" + view); } catch (e) { location.hash = view; } }
  render();
  if (window.innerWidth <= 820) $("main").scrollIntoView({ block: "start" });
}

document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v) { e.preventDefault(); go(v.dataset.view, true); if (window.innerWidth > 820) window.scrollTo(0, 0); return; }
  const t = e.target.closest("[data-type]");
  if (t) { state.type = t.dataset.type; renderMain(); return; }
  const c = e.target.closest("[data-done]");
  if (c) {
    const k = c.dataset.done;
    if (done[k]) delete done[k]; else done[k] = 1;
    save(); render();
    const again = document.querySelector(`[data-done="${CSS.escape(k)}"]`);
    if (again) again.focus();
    return;
  }
  if (e.target.closest("[data-clear]")) { state.q = ""; $("q").value = ""; render(); $("q").focus(); }
});

$("q").addEventListener("input", e => { state.q = e.target.value.trim(); state.type = "All"; render(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q") && state.q) { state.q = ""; $("q").value = ""; render(); }
});

function fromHash() {
  const h = (location.hash || "").slice(1);
  const valid = h === "home" || TOPICS.concat(QUICK).some(t => t[0] === h);
  state.view = valid ? h : "home"; state.type = "All";
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
